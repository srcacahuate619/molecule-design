# docker-compose.yml
# Desarrollo en servidor Ubuntu (Host Local).
# PostgreSQL, Redis y MinIO corren como contenedores del sistema (fuera de esta compose).
#
# Puertos ajustados para evitar conflictos con otros servicios del servidor:
#   API:      8010 (8000 ocupado por Portainer)
#   Frontend: 3001 (3000 ocupado por open-webui)
#
# Acceso:
#   Backend API:  http://[SERVER_IP]:8010/docs
#   Frontend:     http://[SERVER_IP]:3001

services:

  # ─────────────────────────────────────────────
  # ML RESCORING — Microservicio Python 3.12
  # Separado del backend principal porque ODDT requiere Python 3.12.
  # Comunicación: HTTP en puerto 8001.
  # ─────────────────────────────────────────────
  rescoring:
    build:
      context: .
      dockerfile: Dockerfile.rescoring
    container_name: moldesign_rescoring
    restart: unless-stopped
    environment:
      RESCORING_LOG_LEVEL: INFO
      VINA_EXECUTABLE_PATH: /usr/local/bin/vina
    ports:
      - "8001:8001"
    volumes:
      - ./rescoring:/app
      - ./artifacts/rescoring:/app/artifacts
      - ./data:/app/data
      - ./data/pdbbind:/data/pdbbind
      - ./data/targets:/data/targets
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; import sys; r = httpx.get('http://localhost:8001/health'); sys.exit(0 if r.status_code == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─────────────────────────────────────────────
  # BACKEND PRINCIPAL — FastAPI
  # Puerto host: 8010 (8000 ocupado por Portainer en este servidor)
  # Los servicios externos (PostgreSQL, Redis, MinIO) se acceden via
  # 172.17.0.1 (gateway Docker bridge → host → contenedores del sistema).
  # ─────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: moldesign_api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SECURE: "false"
      VINA_EXECUTABLE_PATH: /usr/local/bin/vina
      CORS_ORIGINS: '["*"]'
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--loop", "asyncio"]
    ports:
      - "8010:8000"
    volumes:
      - ./backend:/app
      - ./data/targets:/data/targets
      - vina_temp:/tmp/vina
      - almacenamiento-minio_minio_data:/minio_data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s

  # ─────────────────────────────────────────────
  # WORKER CELERY — Jobs pesados (docking, generación 3D)
  # Mismo código que la API, proceso separado.
  # --pool=solo --concurrency=1: requerido por el patrón de event loop
  # persistente que comparte conexiones asyncpg/aioredis entre tasks.
  # ─────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: moldesign_worker
    restart: unless-stopped
    command: celery -A api.celery_app worker --loglevel=info --pool=solo --concurrency=1
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SECURE: "false"
      VINA_EXECUTABLE_PATH: /usr/local/bin/vina
    volumes:
      - ./backend:/app
      - vina_temp:/tmp/vina
      - ./data/targets:/data/targets

  # ─────────────────────────────────────────────
  # FLOWER — Monitor de tareas Celery
  # Solo con: docker compose --profile dev up
  # ─────────────────────────────────────────────
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: moldesign_flower
    restart: unless-stopped
    command: celery -A api.celery_app flower --port=5555
    ports:
      - "5555:5555"
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: ${REDIS_URL}
    depends_on:
      - worker
    profiles:
      - dev

  # ─────────────────────────────────────────────
  # FRONTEND — Next.js
  # Puerto host: 3001 (3000 ocupado por open-webui en este servidor)
  # NEXT_PUBLIC_API_URL apunta a la IP del servidor para que el navegador
  # del usuario pueda alcanzar la API (no localhost).
  # Arranca con: docker compose --profile dev up -d
  # ─────────────────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: moldesign_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- -p 3001"
    ports:
      - "3001:3001"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NODE_ENV: development
    profiles:
      - dev

  # ─────────────────────────────────────────────
  # NGROK TUNNEL — Túnel estático para la API
  # ─────────────────────────────────────────────
  ngrok:
    image: ngrok/ngrok:latest
    container_name: moldesign_ngrok
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: "${NGROK_AUTHTOKEN}"
    command: "http --url=${NGROK_URL} api:8000"
    depends_on:
      - api

# ─────────────────────────────────────────────
# VOLÚMENES
# ─────────────────────────────────────────────
volumes:
  vina_temp:
    driver: local
  frontend_node_modules:
    driver: local
  almacenamiento-minio_minio_data:
    external: true

