# docker-compose.yml
# Desarrollo en servidor Ubuntu (192.168.1.64).
# PostgreSQL, Redis y MinIO corren como contenedores del sistema (fuera de esta compose).
#
# Puertos ajustados para evitar conflictos con otros servicios del servidor:
#   API:      8010 (8000 ocupado por Portainer)
#   Frontend: 3001 (3000 ocupado por open-webui)
#
# Acceso:
#   Backend API:  http://192.168.1.64:8010/docs
#   Frontend:     http://192.168.1.64:3001

services:

  # ─────────────────────────────────────────────
  # ML RESCORING — Microservicio Python 3.12
  # Separado del backend principal porque ODDT requiere Python 3.12.
  # Comunicación: HTTP en puerto 8001.
  # ─────────────────────────────────────────────
  rescoring:
    build:
      context: .
      dockerfile: Dockerfile.rescoring
    container_name: moldesign_rescoring
    restart: unless-stopped
    environment:
      RESCORING_LOG_LEVEL: INFO
      VINA_EXECUTABLE_PATH: /usr/local/bin/vina
    ports:
      - "8001:8001"
    volumes:
      - ./rescoring:/app
      - ./artifacts/rescoring:/app/artifacts
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import httpx; import sys;

            try:

            \ r = httpx.get('http://localhost:8001/health');

            \ if r.status_code == 200: sys.exit(0)

            \ except Exception: pass

            sys.exit(1)"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - moldesign_net

  # ─────────────────────────────────────────────
  # BACKEND PRINCIPAL — FastAPI
  # Puerto host: 8010 (8000 ocupado por Portainer en este servidor)
  # Los servicios externos (PostgreSQL, Redis, MinIO) se acceden via
  # 172.17.0.1 (gateway Docker bridge → host → contenedores del sistema).
  # ─────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: moldesign_api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://admin:Johan619.@172.17.0.1:5432/moldesign_db
      REDIS_URL: redis://172.17.0.1:6379/0
      MINIO_ENDPOINT: 172.17.0.1:9005
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: Johan619.
      MINIO_SECURE: "false"
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:3001","http://localhost:5173","http://192.168.1.64:3001","http://192.168.1.64:3000","http://192.168.1.64:8010","https://molecule-design-4ztv.vercel.app"]'
    ports:
      - "8010:8000"
    volumes:
      - ./backend:/app
      - vina_temp:/tmp/vina
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - moldesign_net

  # ─────────────────────────────────────────────
  # WORKER CELERY — Jobs pesados (docking, generación 3D)
  # Mismo código que la API, proceso separado.
  # --pool=solo --concurrency=1: requerido por el patrón de event loop
  # persistente que comparte conexiones asyncpg/aioredis entre tasks.
  # ─────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: moldesign_worker
    restart: unless-stopped
    command: celery -A api.celery_app worker --loglevel=info --pool=prefork --concurrency=2
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://admin:Johan619.@172.17.0.1:5432/moldesign_db
      REDIS_URL: redis://172.17.0.1:6379/0
      MINIO_ENDPOINT: 172.17.0.1:9005
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: Johan619.
      MINIO_SECURE: "false"
      VINA_EXECUTABLE_PATH: /usr/local/bin/vina
    volumes:
      - ./backend:/app
      - vina_temp:/tmp/vina
    networks:
      - moldesign_net

  # ─────────────────────────────────────────────
  # FLOWER — Monitor de tareas Celery
  # Solo con: docker compose --profile dev up
  # ─────────────────────────────────────────────
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: moldesign_flower
    restart: unless-stopped
    command: celery -A api.celery_app flower --port=5555
    ports:
      - "5555:5555"
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://172.17.0.1:6379/0
    depends_on:
      - worker
    profiles:
      - dev
    networks:
      - moldesign_net

  # ─────────────────────────────────────────────
  # FRONTEND — Next.js
  # Puerto host: 3001 (3000 ocupado por open-webui en este servidor)
  # NEXT_PUBLIC_API_URL apunta a la IP del servidor para que el navegador
  # del usuario pueda alcanzar la API (no localhost).
  # Arranca con: docker compose --profile dev up -d
  # ─────────────────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: moldesign_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- -p 3001"
    ports:
      - "3001:3001"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://192.168.1.64:8010
      NODE_ENV: development
    profiles:
      - dev
    networks:
      - moldesign_net

# ─────────────────────────────────────────────
# VOLÚMENES
# ─────────────────────────────────────────────
volumes:
  vina_temp:
    driver: local
  frontend_node_modules:
    driver: local

# ─────────────────────────────────────────────
# RED INTERNA
# ─────────────────────────────────────────────
networks:
  moldesign_net:
    driver: bridge
